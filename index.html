<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prayer Companion 2</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prayer 2">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Plain strips along the top and bottom edges in the sky's top and
       bottom colours, so each edge of the phone blends with its own end of the sky. -->
  <div class="edge-tint edge-top"></div>
  <div class="edge-tint edge-bottom"></div>
  <div id="root"></div>
  <!-- Hidden unless the stylesheet loads and the phone is sideways. -->
  <div class="rotate-note" aria-live="polite" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
    Please turn your phone upright
  </div>
  <script>
    // If the app hasn't appeared after a few seconds (for example the phone
    // kept an old copy of this page whose files have since been replaced),
    // reload once to fetch everything fresh.
    setTimeout(function () {
      var root = document.getElementById('root');
      var last = Number(sessionStorage.getItem('pc2_blank_reload') || 0);
      if (root && !root.children.length && Date.now() - last > 60000) {
        sessionStorage.setItem('pc2_blank_reload', String(Date.now()));
        location.reload();
      }
    }, 4000);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
